<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Stars & TON Mobile Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tg: {
                            blue: '#2AABEE',
                            dark: '#080c14',
                            card: '#0f172a',
                            accent: '#38bdf8',
                            glow: 'rgba(42, 171, 238, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #080c14 75%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(56, 189, 248, 0.18);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(42, 171, 238, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 30px rgba(42, 171, 238, 0.3);
        }
        .btn-glow {
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
        }
        .glow-input:focus {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #080c14;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-100 flex items-center justify-center p-3 sm:p-6 md:p-8">

    <div class="w-full max-w-lg mx-auto relative">
        <!-- Floating Ambient Background Elements -->
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Main Card -->
        <div class="glass-card rounded-[28px] p-5 sm:p-8 relative z-10 transition-all duration-300">
            
            <!-- Header -->
            <div class="flex items-center justify-between mb-6 pb-5 border-b border-slate-800/80">
                <div class="flex items-center space-x-3.5">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-400 to-indigo-600 flex items-center justify-center glow-effect text-white text-xl shadow-lg">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-bold tracking-tight bg-gradient-to-r from-white via-sky-100 to-sky-300 bg-clip-text text-transparent">Telegram Stars Engine</h1>
                        <p class="text-xs text-slate-400 mt-0.5">Мобильный калькулятор стоимости</p>
                    </div>
                </div>
                <!-- Action Controls (Presets & Reset) -->
                <div class="flex items-center space-x-2">
                    <button onclick="loadPresets()" title="Пресет" class="w-9 h-9 bg-slate-800/80 hover:bg-slate-700 border border-slate-700/80 rounded-xl text-sky-400 flex items-center justify-center transition-all active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-bolt text-xs"></i>
                    </button>
                    <button onclick="resetForm()" title="Сбросить" class="w-9 h-9 bg-slate-800/80 hover:bg-slate-700 border border-slate-700/80 rounded-xl text-slate-400 hover:text-red-400 flex items-center justify-center transition-all active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-rotate-right text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="space-y-4 mb-6">
                
                <!-- Input 1: p (Цена покупки звезд тг) -->
                <div class="space-y-1.5">
                    <label for="input-p" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 flex justify-between">
                        <span>1. Цена покупки звезд (p)</span>
                        <span class="text-sky-400 font-normal normal-case">USD / шт</span>
                    </label>
                    <div class="relative rounded-2xl transition-all">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-sky-400">
                            <i class="fa-solid fa-tag text-sm"></i>
                        </div>
                        <input type="text" inputmode="decimal" id="input-p" value="0.015" placeholder="0.00" 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-950/70 border border-slate-800 rounded-2xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 glow-input text-base font-medium transition-all">
                    </div>
                </div>

                <!-- Input 2: d (Курс рубля к доллару) -->
                <div class="space-y-1.5">
                    <label for="input-d" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 flex justify-between">
                        <span>2. Курс рубля к доллару (d)</span>
                        <span class="text-sky-400 font-normal normal-case">RUB/USD</span>
                    </label>
                    <div class="relative rounded-2xl transition-all">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-sky-400">
                            <i class="fa-solid fa-ruble-sign text-sm"></i>
                        </div>
                        <input type="text" inputmode="decimal" id="input-d" value="95.0" placeholder="0.00" 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-950/70 border border-slate-800 rounded-2xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 glow-input text-base font-medium transition-all">
                    </div>
                </div>

                <!-- Input 3: s (Кол-во звезд) -->
                <div class="space-y-1.5">
                    <label for="input-s" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 flex justify-between">
                        <span>3. Количество звезд (s)</span>
                        <span class="text-sky-400 font-normal normal-case">STARS</span>
                    </label>
                    <div class="relative rounded-2xl transition-all">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-sky-400">
                            <i class="fa-solid fa-coins text-sm"></i>
                        </div>
                        <input type="text" inputmode="decimal" id="input-s" value="1000" placeholder="0" 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-950/70 border border-slate-800 rounded-2xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 glow-input text-base font-medium transition-all">
                    </div>
                </div>

                <!-- Input 4: g (Цена TON / Gram к доллару) -->
                <div class="space-y-1.5">
                    <label for="input-g" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 flex justify-between">
                        <span>4. Цена TON / Gram (g)</span>
                        <span class="text-sky-400 font-normal normal-case">USD / TON</span>
                    </label>
                    <div class="relative rounded-2xl transition-all">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-sky-400">
                            <i class="fa-solid fa-gem text-sm"></i>
                        </div>
                        <input type="text" inputmode="decimal" id="input-g" value="5.50" placeholder="0.00" 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-950/70 border border-slate-800 rounded-2xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 glow-input text-base font-medium transition-all">
                    </div>
                </div>

            </div>

            <div class="mb-6">
                <button onclick="calculate()" class="w-full py-4 px-6 bg-gradient-to-r from-sky-400 via-sky-500 to-indigo-600 hover:from-sky-300 hover:to-indigo-500 text-slate-950 font-bold text-base rounded-2xl btn-glow transition-all active:scale-[0.98] flex items-center justify-center space-x-2.5 cursor-pointer">
                    <i class="fa-solid fa-calculator text-lg"></i>
                    <span>Подсчитать</span>
                </button>
            </div>

            <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-sky-950/50 via-slate-900/70 to-indigo-950/50 border border-sky-500/25 p-5 sm:p-6">
                <div class="absolute top-0 right-0 -mt-6 -mr-6 w-32 h-32 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>

                <div class="flex items-center justify-between gap-2 mb-3">
                    <div>
                        <span class="text-[11px] font-bold uppercase tracking-wider text-sky-400">Результат расчета</span>
                        <div class="text-[10px] text-slate-400 mt-0.5">Формула: ((p × d × s) / g)<sup>0.98</sup></div>
                    </div>
                    <!-- Copy Button -->
                    <button onclick="copyResult()" id="copy-btn" class="px-3.5 py-2 bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/40 text-sky-300 font-semibold text-xs rounded-xl transition-all flex items-center space-x-1.5 cursor-pointer active:scale-95">
                        <i class="fa-regular fa-copy"></i>
                        <span>Копировать</span>
                    </button>
                </div>

                <!-- Main Output Value -->
                <div class="my-2">
                    <div id="result-value" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white drop-shadow">
                        0.00
                    </div>
                </div>

                <!-- Intermediate Metrics Breakdown -->
                <div class="grid grid-cols-3 gap-2 pt-3 border-t border-slate-800/80 mt-4 text-[11px]">
                    <div>
                        <span class="text-slate-500 block truncate">p*d*s:</span>
                        <span id="sub-base" class="font-semibold text-slate-200 text-xs truncate block">0.00</span>
                    </div>
                    <div>
                        <span class="text-slate-500 block truncate">Деление на g:</span>
                        <span id="sub-div" class="font-semibold text-slate-200 text-xs truncate block">0.00</span>
                    </div>
                    <div>
                        <span class="text-slate-500 block truncate">Степень ^0.98:</span>
                        <span id="sub-pow" class="font-semibold text-slate-200 text-xs truncate block">0.98</span>
                    </div>
                </div>
            </div>

            <!-- Footer Note -->
            <div class="mt-5 text-center text-[11px] text-slate-500">
                Telegram Stars & TON Ecosystem • Optimized for Mobile
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 sm:left-auto sm:right-6 sm:translate-x-0 bg-slate-900 border border-sky-500/40 text-slate-100 px-4 py-3 rounded-2xl shadow-2xl transform translate-y-28 opacity-0 transition-all duration-300 flex items-center space-x-3 z-50">
        <div class="w-6 h-6 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center text-xs flex-shrink-0">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toast-msg" class="text-xs sm:text-sm font-medium whitespace-nowrap">Результат скопирован!</span>
    </div>

    <script>
        // DOM elements
        const inputP = document.getElementById('input-p');
        const inputD = document.getElementById('input-d');
        const inputS = document.getElementById('input-s');
        const inputG = document.getElementById('input-g');

        const resultValueEl = document.getElementById('result-value');
        const subBaseEl = document.getElementById('sub-base');
        const subDivEl = document.getElementById('sub-div');
        const toastEl = document.getElementById('toast');

        let lastCalculatedResult = '0.00';

        // Helper to parse decimal values correctly with commas or dots
        function parseVal(valueStr) {
            if (!valueStr) return 0;
            const normalized = String(valueStr).replace(',', '.');
            const num = parseFloat(normalized);
            return isNaN(num) ? 0 : num;
        }

        function calculate() {
            const p = parseVal(inputP.value);
            const d = parseVal(inputD.value);
            const s = parseVal(inputS.value);
            const g = parseVal(inputG.value);

            // Intermediate metrics
            const baseVal = p * d * s;
            
            let divVal = 0;
            let finalResult = 0;

            if (g !== 0) {
                divVal = baseVal / g;
                if (divVal >= 0) {
                    finalResult = Math.pow(divVal, 0.98);
                } else {
                    finalResult = 0;
                }
            } else {
                divVal = 0;
                finalResult = 0;
            }

            // Format outputs
            lastCalculatedResult = finalResult.toFixed(4);
            
            resultValueEl.textContent = formatNumber(finalResult);
            subBaseEl.textContent = baseVal.toLocaleString('ru-RU', {maximumFractionDigits: 2});
            subDivEl.textContent = divVal.toLocaleString('ru-RU', {maximumFractionDigits: 2});

            // Trigger subtle animation on result box
            resultValueEl.classList.add('scale-105', 'text-sky-300');
            setTimeout(() => {
                resultValueEl.classList.remove('scale-105', 'text-sky-300');
            }, 200);

            showToast('Расчет успешно выполнен!');
        }

        function formatNumber(num) {
            if (isNaN(num) || !isFinite(num)) return '0.00';
            if (num >= 1000000) {
                return num.toLocaleString('ru-RU', {maximumFractionDigits: 2});
            } else if (num >= 1) {
                return num.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 4});
            } else {
                return num.toFixed(6);
            }
        }

        function loadPresets() {
            inputP.value = '1.57';
            inputD.value = '0.012';
            inputS.value = '5000';
            inputG.value = '1.4';
            calculate();
            showToast('Пресет загружен!');
        }

        function resetForm() {
            inputP.value = '';
            inputD.value = '';
            inputS.value = '';
            inputG.value = '';
            resultValueEl.textContent = '0.00';
            subBaseEl.textContent = '0.00';
            subDivEl.textContent = '0.00';
            lastCalculatedResult = '0.00';
            showToast('Форма очищена');
        }

        function copyResult() {
            if (!lastCalculatedResult || lastCalculatedResult === '0.00') {
                showToast('Нет данных для копирования');
                return;
            }
            
            // Fallback copy method for iframe and mobile compatibility
            const textArea = document.createElement("textarea");
            textArea.value = lastCalculatedResult;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Скопировано: ' + lastCalculatedResult);
                } else {
                    showToast('Не удалось скопировать');
                }
            } catch (err) {
                showToast('Ошибка копирования');
            }

            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const msgEl = document.getElementById('toast-msg');
            msgEl.textContent = msg;
            toastEl.classList.remove('translate-y-28', 'opacity-0');
            setTimeout(() => {
                toastEl.classList.add('translate-y-28', 'opacity-0');
            }, 2500);
        }

        // Allow pressing Enter in inputs to calculate
        [inputP, inputD, inputS, inputG].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    input.blur();
                    calculate();
                }
            });
        });

        // Initial calculation on load
        window.addEventListener('DOMContentLoaded', () => {
            calculate();
        });
    </script>
</body>
</html>
